name: Validate and publish reviewed py-mermaid
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable reviewed candidate tag
        type: string
        default: py-visactor-mermaid-v0.1.0
        required: true
      manifest_sha256:
        description: SHA256 of reviewed release-manifest.json
        type: string
        required: true
      publish:
        description: Upload the validated exact files to PyPI
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: py-mermaid-release-${{ inputs.release_tag }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download and verify exact candidate bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: python tools/release_github.py download --tag "$RELEASE_TAG" --manifest-sha256 "$MANIFEST_SHA" --out test-runs/download
      - name: Fresh external wheel and sdist installation and static rendering
        run: python tools/release_package.py install --manifest test-runs/download/release-manifest.json --packages test-runs/download/packages --out test-runs/installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-validation-${{ matrix.os }}
          path: test-runs/
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/py-visactor-mermaid/0.1.0/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reverify upload bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: python tools/release_github.py download --tag "$RELEASE_TAG" --manifest-sha256 "$MANIFEST_SHA" --out test-runs/download
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: test-runs/download/packages/
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download reviewed identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: python tools/release_github.py download --tag "$RELEASE_TAG" --manifest-sha256 "$MANIFEST_SHA" --out test-runs/download
      - name: Check PyPI bytes and install both published distributions
        run: |
          python tools/release_package.py pypi --manifest test-runs/download/release-manifest.json --out test-runs/pypi
          python tools/release_package.py install --manifest test-runs/pypi/release-manifest.json --packages test-runs/pypi --out test-runs/pypi-installed
      - name: Promote verified release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python tools/release_github.py promote --tag "$RELEASE_TAG" --manifest test-runs/download/release-manifest.json --out test-runs/promoted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pypi-verification
          path: test-runs/
          if-no-files-found: error
