name: Bootstrap and source provenance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/validate_bootstrap.py
      - run: python -m unittest discover -s tests/bootstrap -v
      - run: python scripts/upstream.py fetch
      - run: python scripts/upstream.py check
