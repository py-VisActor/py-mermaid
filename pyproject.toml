[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-visactor-mermaid"
version = "0.1.1"
description = "Static Mermaid and VChart diagrams in Python using py-skia-canvas, pyelk and py-katex"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "references/licenses/*"]
dependencies = ["py-skia-canvas==0.1.0a18", "py-visactor-elk==0.1.0", "py-visactor-katex==0.1.0", "py-visactor-vchart==0.1.1"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = ["build==1.6.1", "setuptools==84.2.1", "wheel==0.48.0"]

[project.scripts]
py-mermaid = "py_mermaid.cli:main"

[project.urls]
Repository = "https://github.com/py-VisActor/py-mermaid"
Documentation = "https://github.com/py-VisActor/py-mermaid/blob/main/docs/README.md"
Issues = "https://github.com/py-VisActor/py-mermaid/issues"
Changelog = "https://github.com/py-VisActor/py-mermaid/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py_mermaid = ["py.typed", "data/*.json", "diagrams/zenuml/assets/*"]
